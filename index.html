<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b8f5df"><title>VƯỜN ÂM NHẠC KỲ DIỆU</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Arial',sans-serif;background:linear-gradient(150deg,#c5f4ff,#e4ffe4 55%,#fff1b5);color:#16434c;min-height:100vh}.app{max-width:1040px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.pill{border:2px solid #fff;background:#ffffffc9;border-radius:40px;padding:10px 16px;box-shadow:0 5px 14px #16727b22;font-weight:800}.hero{text-align:center;background:linear-gradient(160deg,#ffffffdf,#d7f7edc9);border:4px solid white;border-radius:35px;margin:14px 0;padding:18px 12px;box-shadow:0 15px 35px #367b8033}h1{margin:4px;font-size:clamp(24px,4vw,43px);color:#0d8b73;text-shadow:0 3px white}.subtitle{font-size:clamp(15px,2vw,20px);font-weight:650}.scene{position:relative;min-height:200px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:14px;background:linear-gradient(#a4e8ff 0 57%,#9be2a3 57% 100%);border-radius:26px;border:4px solid #fff;overflow:hidden}.figure{font-size:clamp(52px,10vw,110px);filter:drop-shadow(0 12px 4px #24502d40);animation:bob 2.5s ease-in-out infinite}.figure:nth-child(2){animation-delay:.5s}.figure:nth-child(3){animation-delay:1s}@keyframes bob{50%{transform:translateY(-9px) rotate(3deg)}}.panel{background:#ffffffed;border:3px solid white;border-radius:26px;padding:18px;margin-top:15px;box-shadow:0 8px 22px #307d7930;text-align:center}.question{font-size:clamp(21px,3vw,30px);font-weight:850;margin:8px 0 14px}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}button{cursor:pointer;border:0;border-bottom:5px solid #177e67;border-radius:18px;background:linear-gradient(#63edb5,#20b987);color:#063d34;padding:14px 22px;font-size:clamp(16px,2.5vw,22px);font-weight:850;min-height:55px;box-shadow:0 6px 12px #276e5d33}button:active{transform:translateY(3px);border-bottom-width:2px}button:focus-visible{outline:4px solid #ffb900}.alt{background:linear-gradient(#ffed94,#ffba45);border-color:#c98d27}.blue{background:linear-gradient(#a3e8ff,#59bbff);border-color:#3286bd}.red{background:linear-gradient(#ffcbca,#ff898c);border-color:#c04e54}.message{font-size:20px;font-weight:800;min-height:35px;padding:7px}.foot{text-align:center;font-size:13px;padding:14px;color:#426765}.hidden{display:none!important}.stars{color:#d28a05}.spark{animation:pop .45s ease}@keyframes pop{50%{transform:scale(1.07)}}@media(max-width:500px){.app{padding:9px}.hero{padding:12px 8px}.scene{min-height:160px}.panel{padding:12px}.choices button{flex:1 1 40%}}</style></head><body><main class="app"><div class="top"><div class="pill">🌱 MẦM XANH AI</div><div class="pill" id="progress">Nhiệm vụ 1/5</div><div class="pill stars" id="stars">⭐ 0</div></div><section class="hero"><h1>VƯỜN ÂM NHẠC KỲ DIỆU</h1><div class="subtitle">Nghe – đoán – chơi nhạc • 5 nhiệm vụ cho bé 5–6 tuổi</div></section><section class="scene" id="scene" aria-label="Hình minh họa trò chơi"><span class="figure">🎹</span><span class="figure">🎼</span><span class="figure">🥁</span></section><section class="panel"><div class="question" id="question"></div><div id="detail" class="subtitle"></div><div class="choices" id="choices"></div><div id="message" class="message" role="status" aria-live="polite"></div><div class="choices"><button class="blue" onclick="speakCurrent()">🔊 Nghe hướng dẫn</button><button class="alt" onclick="restart()">↻ Chơi lại</button></div></section><div class="foot">Trẻ vận động có người lớn quan sát • Âm thanh hoạt động sau khi chạm nút</div></main><script>const tasks=[{title:'Nhạc cụ nào có phím trắng và đen?',answer:'🎹 Đàn piano',choices:['🥁 Trống','🎹 Đàn piano','🎺 Kèn'],en:'Which instrument has black and white keys?',sound:'piano'},{title:'Nhạc cụ nào tạo tiếng khi gõ?',answer:'🥁 Trống',choices:['🎸 Đàn guitar','🎻 Đàn violin','🥁 Trống'],en:'Which instrument do we hit to make a sound?',sound:'drum'},{title:'Nghe âm thanh và chọn nhạc cụ!',answer:'🎺 Kèn',choices:['🎺 Kèn','🥁 Trống','🎹 Đàn piano'],en:'Listen and choose the instrument!',sound:'horn'},{title:'Giai điệu nào đi từ thấp lên cao?',answer:'⬆️ Đô – Mi – Sol',choices:['⬇️ Sol – Mi – Đô','⬆️ Đô – Mi – Sol','🔁 Đô – Đô – Đô'],en:'Which melody goes up?',sound:'ascending'},{title:'Bé hãy chơi 3 nốt Đô – Mi – Sol!',answer:'🎉 Hoàn thành',choices:[],en:'Play do, mi, sol!',sound:'play'}];let level=0,score=0,sequence=[],audio=null;const $=id=>document.getElementById(id);function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}function tone(f,d=.32,type='sine',delay=0){try{let a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,a.currentTime+delay);g.gain.setValueAtTime(.0001,a.currentTime+delay);g.gain.exponentialRampToValueAtTime(.17,a.currentTime+delay+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+delay+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+delay);o.stop(a.currentTime+delay+d+.02)}catch(e){}}function sound(name){if(name==='drum'){tone(110,.15,'triangle');tone(80,.18,'sawtooth',.16)}else if(name==='horn'){tone(392,.45,'sawtooth');tone(523,.5,'sawtooth',.5)}else if(name==='ascending'){[262,330,392].forEach((f,i)=>tone(f,.34,'sine',i*.4))}else [262,330,392].forEach((f,i)=>tone(f,.3,'triangle',i*.36))}function say(t,lang='en-US'){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.83;speechSynthesis.speak(u)}function speakCurrent(){if(level<tasks.length){say(tasks[level].en);sound(tasks[level].sound)}}function render(){if(level>=tasks.length){$('progress').textContent='Hoàn thành!';$('scene').innerHTML='<span class="figure">🏆</span><span class="figure">🎼</span><span class="figure">🎉</span>';$('question').textContent='Bé là nghệ sĩ nhí tài năng!';$('detail').textContent='Con đã khám phá âm nhạc qua 5 nhiệm vụ.';$('choices').innerHTML='<button onclick="restart()">🎶 Chơi lại</button>';$('message').textContent='⭐ Bé nhận '+score+' ngôi sao!';sound('ascending');return}let t=tasks[level];$('progress').textContent='Nhiệm vụ '+(level+1)+'/5';$('stars').textContent='⭐ '+score;$('scene').innerHTML='<span class="figure">🎹</span><span class="figure">🎼</span><span class="figure">🥁</span><span class="figure">🎺</span>';$('question').textContent=t.title;$('detail').textContent=level===4?'Chạm lần lượt vào ba phím đàn: Đô → Mi → Sol.':'Nhấn nút nghe âm thanh rồi chọn đáp án đúng.';$('message').textContent='';sequence=[];if(level===4){$('choices').innerHTML='<button class="blue" onclick="note(262,'Đô')">🎹 Đô</button><button class="alt" onclick="note(330,'Mi')">🎹 Mi</button><button class="red" onclick="note(392,'Sol')">🎹 Sol</button>';return}$('choices').innerHTML=t.choices.map(c=>'<button class="alt" onclick="choose(this)">'+c+'</button>').join('')}function choose(btn){let t=tasks[level];if(btn.textContent===t.answer){score++;$('stars').textContent='⭐ '+score;$('message').textContent='🎉 Chính xác! Giỏi quá!';sound('ascending');$('choices').innerHTML='<button onclick="next()">➡ Nhiệm vụ tiếp theo</button>'}else{$('message').textContent='💛 Chưa đúng, bé thử lại nhé!';tone(196,.15)}}function note(f,n){tone(f,.45,'triangle');sequence.push(n);$('message').textContent='🎵 '+sequence.join(' – ');let expected=['Đô','Mi','Sol'];if(sequence[sequence.length-1]!==expected[sequence.length-1]){sequence=[];$('message').textContent='💛 Thử lại theo thứ tự Đô – Mi – Sol nhé!';return}if(sequence.length===3){score++;$('stars').textContent='⭐ '+score;$('message').textContent='🎉 Bé chơi đàn rất giỏi!';$('choices').innerHTML='<button onclick="next()">🏆 Nhận phần thưởng</button>'}}function next(){level++;render()}function restart(){level=0;score=0;render()}render();</script></body></html>
