<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Vườn âm nhạc kỳ diệu - Mầm Xanh AI</title><style>
:root{--ink:#19405a;--pink:#ff6fa8;--mint:#6bd8a3;--blue:#56c8ff;--yellow:#ffcb57}*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff7c7,transparent 35%),radial-gradient(circle at 90% 5%,#c8f4ff,transparent 35%),linear-gradient(155deg,#d5ffe8,#e6e5ff 55%,#fff0d6);min-height:100vh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #1554d1}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1120px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.pill{border:2px solid #fff;background:#ffffffcf;border-radius:999px;padding:10px 15px;box-shadow:0 5px 0 #a5d3c4;font-weight:900}.hero{margin:16px 0;background:linear-gradient(120deg,#fff9db,#f6e9ff,#d5f7ff);border:5px solid white;border-radius:34px;text-align:center;padding:16px;box-shadow:0 12px 28px #598eaa25}.hero h1{margin:0;font-size:clamp(27px,5vw,52px);color:#f56a9e;text-shadow:2px 3px 0 #fff,4px 5px 0 #ffdc67}.hero p{margin:7px 0;font-weight:800}.scene{position:relative;border-radius:28px;border:5px solid white;overflow:hidden;min-height:145px;background:linear-gradient(#7edbff 0 58%,#8ee3a1 58%);display:flex;align-items:center;justify-content:space-evenly;box-shadow:0 8px 20px #45799a22}.scene .toy{font-size:clamp(55px,10vw,110px);filter:drop-shadow(0 12px 4px #267c6a50);animation:bob 2.5s ease-in-out infinite}.scene .toy:nth-child(2){animation-delay:.5s}.scene .toy:nth-child(3){animation-delay:1s}@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:18px 0}.tile{border:4px solid white;border-radius:25px;min-height:145px;padding:12px;background:linear-gradient(150deg,#fff,#ffe1f0);box-shadow:0 8px 0 #d2bad8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .12s}.tile:nth-child(2n){background:linear-gradient(140deg,#fff,#d9f9ec)}.tile:nth-child(3n){background:linear-gradient(140deg,#fff,#d9efff)}.tile:hover{transform:translateY(-4px)}.tile .emoji{font-size:48px}.tile strong{font-size:clamp(15px,2.2vw,22px)}.tile small{font-weight:700}.panel{background:#fffffff0;border:5px solid white;border-radius:30px;padding:20px;margin:16px 0;box-shadow:0 14px 30px #4b72952b;min-height:300px}.hidden{display:none!important}.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}.btn{border:0;border-radius:19px;padding:13px 22px;min-height:54px;font-weight:900;font-size:18px;background:linear-gradient(#ffde76,#ffae45);box-shadow:0 6px 0 #c98c3c;color:#183d51}.btn.blue{background:linear-gradient(#9feaff,#4dbcf4);box-shadow:0 6px 0 #3883b7}.btn.pink{background:linear-gradient(#ffb6d4,#ff75ac);box-shadow:0 6px 0 #bf5d8a}.btn.green{background:linear-gradient(#b4ffcb,#55d99c);box-shadow:0 6px 0 #319b70}.btn:active,.tile:active,.choice:active{transform:translateY(4px);box-shadow:0 2px 0 #8f9eaa}.question{text-align:center;font-size:clamp(21px,3vw,29px);font-weight:900;margin:12px 0}.sub{text-align:center;font-size:16px;font-weight:700;color:#527287}.center{text-align:center}.choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:22px 0}.choice{border:4px solid #fff;border-radius:23px;background:linear-gradient(#fff6cc,#ffe2f2);padding:16px 20px;min-width:120px;min-height:98px;font-weight:900;font-size:20px;box-shadow:0 6px 0 #d4b7c8}.choice .big{display:block;font-size:46px}.keyboard{display:flex;justify-content:center;gap:4px;margin:20px auto;max-width:700px}.key{flex:1;min-width:0;height:150px;border:3px solid white;border-radius:0 0 16px 16px;box-shadow:0 8px 0 #96b7c8;font-weight:900;font-size:20px;display:flex;align-items:end;justify-content:center;padding-bottom:14px;color:#183b54}.key:active,.key.active{transform:translateY(6px);box-shadow:0 2px 0 #96b7c8;filter:brightness(1.15)}.rhythm{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:22px 0}.beat{width:65px;height:65px;border-radius:20px;background:#e6e9f4;border:4px solid white;display:grid;place-items:center;font-size:30px;font-weight:900;box-shadow:0 5px 0 #b5c5d5}.beat.on{background:#ffe26c;transform:scale(1.12)}.feedback{font-size:21px;font-weight:900;text-align:center;min-height:32px;color:#008b6a}.footer{text-align:center;font-size:13px;padding:15px;color:#5d7b8b}.stars{font-size:20px;color:#d78600}.meter{height:14px;background:#e8e9f1;border-radius:20px;overflow:hidden;margin:10px 0}.meter>div{height:100%;background:linear-gradient(90deg,#68d5ff,#62e6a2);transition:width .3s}.move{font-size:110px;text-align:center;animation:bob 1.2s infinite}.note{font-size:25px}.step{font-weight:900;text-align:center;color:#e15e9e}.drum{font-size:65px}.spark{position:fixed;pointer-events:none;font-size:26px;animation:fly 1.4s ease-out forwards;z-index:50}@keyframes fly{to{transform:translate(var(--x),-180px) rotate(90deg);opacity:0}}@media(max-width:680px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{min-height:133px}.tile .emoji{font-size:38px}.panel{padding:13px}.key{height:120px;font-size:14px}.choice{min-width:95px}.scene{min-height:115px}}
</style></head><body><main class="wrap"><div class="top"><span class="pill">🌱 MẦM XANH AI</span><span class="pill" id="progress">🎵 6 khu vườn âm nhạc</span><span class="pill stars" id="stars">⭐ 0 sao</span></div><header class="hero"><h1>🎶 VƯỜN ÂM NHẠC KỲ DIỆU 🎶</h1><p>Chạm – nghe – chơi đàn – sáng tạo – vận động!</p></header><div class="scene"><span class="toy">👧🏻</span><span class="toy">🤖</span><span class="toy">🎹</span><span class="toy">👦🏻</span></div><section id="home"><p class="question">Bé chọn khu vườn muốn khám phá nhé!</p><div class="grid" id="menu"></div><div class="actions"><button class="btn blue" id="intro">🔊 Nghe lời chào</button><button class="btn green" id="all">▶ Chơi lần lượt 6 khu</button><button class="btn" id="sound">🔊 Âm thanh: Bật</button></div></section><section id="game" class="panel hidden" aria-live="polite"><div class="top"><button class="btn blue" id="back">⌂ Về khu vườn</button><strong id="gameTitle"></strong><span class="pill" id="round"></span></div><div class="meter"><div id="bar" style="width:0%"></div></div><div id="content"></div><p class="feedback" id="feedback"></p></section><div class="footer">Dành cho trẻ 5–6 tuổi • Trẻ vận động cần có người lớn quan sát • Âm thanh phát khi bé chạm nút</div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ctx=null,muted=false,stars=0,mode=-1,round=0,sequence=[],input=[],pattern=[],beats=0,all=false,locked=false;const names=['Đàn piano sắc màu','Đoán tiếng nhạc cụ','Nhớ giai điệu','Ban nhạc tí hon','Vũ điệu vui nhộn','Sân khấu biểu diễn'],icons=['🎹','🥁','🧠','🎺','💃','🎤'],desc=['Chơi 8 nốt nhạc','Nghe và tìm đúng','Nghe – nhớ – chạm','Tạo tiết tấu riêng','Vận động theo nhịp','Sáng tác và biểu diễn'],freq=[261.63,293.66,329.63,349.23,392,440,493.88,523.25],colors=['#ff9eab','#ffcb73','#ffe87b','#b1e7a6','#8edff0','#b8b9ff','#f1b5f4','#ffc7a5'];const menu=$('menu');names.forEach((n,i)=>{const b=document.createElement('button');b.className='tile';b.innerHTML=`<span class="emoji">${icons[i]}</span><strong>${n}</strong><small>${desc[i]}</small>`;b.onclick=()=>start(i);menu.appendChild(b)});function audio(){if(muted)return null;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}catch(e){return null}}function tone(f,d=.3,type='sine',delay=0){const a=audio();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}function noise(d=.25){const a=audio();if(!a)return;const n=a.createBuffer(1,Math.floor(a.sampleRate*d),a.sampleRate),v=n.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=(Math.random()*2-1)*Math.pow(1-i/v.length,2);const s=a.createBufferSource(),g=a.createGain();s.buffer=n;g.gain.value=.25;s.connect(g);g.connect(a.destination);s.start()}function instrument(i){if(i===0)tone(392,.4,'sine');if(i===1){tone(130,.18,'triangle');noise(.15)}if(i===2){tone(523,.14,'triangle');tone(659,.16,'triangle',.17)}if(i===3){tone(330,.55,'sawtooth')}if(i===4){tone(660,.17,'sine');tone(880,.3,'sine',.2)}}function say(t){if(muted)return;try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.85;u.pitch=1.12;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang.toLowerCase().startsWith('vi'));if(v)u.voice=v;speechSynthesis.speak(u)}}catch(e){}}function note(i){tone(freq[i],.36,i%2?'triangle':'sine')}function fanfare(){[0,2,4,7].forEach((n,i)=>tone(freq[n],.22,'sine',i*.13))}function confetti(){for(let i=0;i<14;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','🎵','🌸','✨'][i%4];s.style.left=(20+Math.random()*60)+'vw';s.style.top=(60+Math.random()*30)+'vh';s.style.setProperty('--x',(Math.random()*180-90)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1450)}}function award(n=1){stars+=n;$('stars').textContent='⭐ '+stars+' sao';fanfare();confetti()}function feedback(t){$('feedback').textContent=t}function start(i){mode=i;round=0;all=false;render();$('home').classList.add('hidden');$('game').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}function next(){round++;if(round>=5){award(2);$('content').innerHTML=`<div class="center"><div style="font-size:85px">🏆🎉</div><p class="question">Hoan hô! Bé đã hoàn thành ${names[mode]}!</p><p class="sub">Bé nhận thêm 2 ngôi sao!</p><div class="actions"><button class="btn green" id="again">🔁 Chơi lại</button><button class="btn pink" id="nextMode">➡ Khám phá khu khác</button></div></div>`;$('round').textContent='Hoàn thành';$('bar').style.width='100%';$('again').onclick=()=>start(mode);$('nextMode').onclick=()=>{if(all&&mode<5){const k=mode+1;start(k);all=true}else home()};return}render()}function render(){locked=false;feedback('');$('gameTitle').textContent=icons[mode]+' '+names[mode];$('round').textContent='Lượt '+(round+1)+'/5';$('bar').style.width=(round/5*100)+'%';if(mode===0)piano();if(mode===1)guess();if(mode===2)memory();if(mode===3)band();if(mode===4)dance();if(mode===5)stage()}function complete(t){if(locked)return;locked=true;award();feedback(t||'Giỏi quá! Bé nhận được 1 ngôi sao! ⭐');const c=$('content');const b=document.createElement('div');b.className='actions';b.innerHTML='<button class="btn green">➡ Tiếp tục</button>';b.firstChild.onclick=next;c.appendChild(b)}function piano(){const goal=[0,2,4,1,3][round];$('content').innerHTML=`<p class="question">🎹 Bé hãy chơi đàn! Chạm các phím để tạo âm thanh.</p><p class="sub">Thử thách: Tìm và chạm phím <b>${['Đô','Rê','Mi','Fa','Sol'][goal]}</b>. Bé có thể chơi tự do trước nhé!</p><div class="keyboard" id="keyboard"></div><div class="actions"><button class="btn blue" id="sample">🔊 Nghe nốt cần tìm</button></div>`;const k=$('keyboard');freq.forEach((f,i)=>{const b=document.createElement('button');b.className='key';b.style.background=colors[i];b.textContent=['Đô','Rê','Mi','Fa','Sol','La','Si','Đô'][i];b.onclick=()=>{note(i);if(i===goal)complete('Đúng nốt rồi! Bé chơi đàn thật hay!');else feedback('Bé thử nghe nốt mẫu rồi tìm lại nhé!')};k.appendChild(b)});$('sample').onclick=()=>note(goal)}const ins=['Đàn piano','Trống','Chuông','Kèn','Lục lạc'],emo=['🎹','🥁','🔔','🎺','🪇'];function guess(){const answer=(round*2+1)%5;let opts=[answer,(answer+1)%5,(answer+3)%5].sort(()=>Math.random()-.5);$('content').innerHTML=`<p class="question">👂 Bé nghe xem nhạc cụ nào đang phát tiếng nhé!</p><div class="actions"><button class="btn blue" id="listen">🔊 Nghe âm thanh</button></div><div class="choices" id="choices"></div>`;$('listen').onclick=()=>instrument(answer);opts.forEach(i=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="big">${emo[i]}</span>${ins[i]}`;b.onclick=()=>{instrument(i);if(i===answer)complete('Chính xác! Bé có đôi tai thật tinh!');else feedback('Chưa đúng rồi, bé nghe lại nhé!')};$('choices').appendChild(b)});setTimeout(()=>{if(mode===1&&!muted)instrument(answer)},350)}function playSeq(seq,done){const duration=seq.length*.55;seq.forEach((n,i)=>setTimeout(()=>{if(mode===2)note(n)},i*550));if(done)setTimeout(done,duration*1000+100)}function memory(){sequence=Array.from({length:Math.min(2+round,6)},(_,i)=>(round*3+i*2+1)%5);input=[];$('content').innerHTML=`<p class="question">🧠 Nghe và nhớ thứ tự các nốt nhạc!</p><p class="sub">Bé nghe mẫu, rồi chạm các bông hoa theo đúng thứ tự.</p><div class="actions"><button class="btn blue" id="playseq">▶ Nghe giai điệu mẫu</button></div><div class="choices" id="flowers"></div><p class="sub" id="count">Đã chọn: 0/${sequence.length}</p>`;for(let i=0;i<5;i++){const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="big">${['🌷','🌻','🌼','🌺','🌸'][i]}</span>${['Đô','Rê','Mi','Fa','Sol'][i]}`;b.onclick=()=>{note(i);input.push(i);$('count').textContent=`Đã chọn: ${input.length}/${sequence.length}`;if(input[input.length-1]!==sequence[input.length-1]){input=[];$('count').textContent=`Đã chọn: 0/${sequence.length}`;feedback('Bé nghe lại và thử lần nữa nhé!')}else if(input.length===sequence.length)complete('Tuyệt vời! Bé nhớ đúng cả giai điệu!')};$('flowers').appendChild(b)}$('playseq').onclick=()=>{feedback('Lắng nghe thật kỹ nhé!');playSeq(sequence,()=>feedback('Bé hãy chạm các bông hoa!'))}}function band(){pattern=[];$('content').innerHTML=`<p class="question">🥁 Bé là nhạc trưởng! Tự tạo một tiết tấu ${3+round} tiếng nhé!</p><p class="sub">Chạm các nhạc cụ theo ý thích. Sau đó nghe lại bản nhạc bé sáng tác.</p><div class="choices" id="inst"></div><div class="rhythm" id="pat"></div><div class="actions"><button class="btn blue" id="hear">▶ Nghe lại</button><button class="btn pink" id="clear">↻ Làm lại</button><button class="btn green" id="done">⭐ Hoàn thành</button></div>`;for(let i=0;i<5;i++){const b=document.createElement('button');b.className='choice';b.innerHTML=`<span class="big">${emo[i]}</span>${ins[i]}`;b.onclick=()=>{instrument(i);if(pattern.length<3+round){pattern.push(i);showPattern()}};$('inst').appendChild(b)}function showPattern(){$('pat').innerHTML=pattern.map((v,i)=>`<span class="beat">${emo[v]}</span>`).join('')}$('hear').onclick=()=>pattern.forEach((i,j)=>setTimeout(()=>instrument(i),j*420));$('clear').onclick=()=>{pattern=[];showPattern();feedback('Bé hãy sáng tác lại nhé!')};$('done').onclick=()=>{if(pattern.length>=3+round)complete('Bé đã sáng tác một tiết tấu rất tuyệt!');else feedback('Bé hãy chọn đủ '+(3+round)+' âm thanh nhé!')}}const moves=[['Vươn tay lên cao','🙆'],['Vỗ tay theo nhịp','👏'],['Lắc lư sang hai bên','🕺'],['Nhún chân tại chỗ','💃'],['Xoay cổ tay nhẹ nhàng','🙌']];function dance(){beats=0;const m=moves[round];$('content').innerHTML=`<p class="question">💃 ${m[0]}!</p><div class="move">${m[1]}</div><p class="sub">Bé làm động tác theo tiếng nhạc. Chạm nút mỗi lần hoàn thành một nhịp.</p><div class="rhythm" id="rhythm">${Array.from({length:4},()=>'<span class="beat">♪</span>').join('')}</div><div class="actions"><button class="btn blue" id="beat">👏 Con đã làm 1 nhịp</button><button class="btn pink" id="demo">🔊 Nghe 4 nhịp</button></div>`;$('beat').onclick=()=>{if(locked)return;tone(440+beats*80,.12,'triangle');$('rhythm').children[beats].classList.add('on');beats++;if(beats>=4)complete('Bé vận động theo nhạc rất giỏi!')};$('demo').onclick=()=>{for(let i=0;i<4;i++)setTimeout(()=>tone(600,.1,'triangle'),i*550)}}function stage(){pattern=[];const need=4+round;$('content').innerHTML=`<p class="question">🎤 Sân khấu của bé – Buổi biểu diễn ${round+1}!</p><p class="sub">Bé tự chọn ${need} nốt nhạc để sáng tác bài hát, sau đó biểu diễn!</p><div class="keyboard" id="stageKeys"></div><div class="rhythm" id="score"></div><div class="actions"><button class="btn blue" id="perform">🎶 Biểu diễn</button><button class="btn pink" id="reset">↻ Sáng tác lại</button><button class="btn green" id="finish">⭐ Hoàn thành bài hát</button></div>`;for(let i=0;i<8;i++){const b=document.createElement('button');b.className='key';b.style.background=colors[i];b.textContent=['Đô','Rê','Mi','Fa','Sol','La','Si','Đô'][i];b.onclick=()=>{note(i);if(pattern.length<need){pattern.push(i);$('score').innerHTML=pattern.map(x=>`<span class="beat">${['🎵','🎶','🌟'][x%3]}</span>`).join('')}};$('stageKeys').appendChild(b)}$('perform').onclick=()=>pattern.forEach((n,i)=>setTimeout(()=>note(n),i*420));$('reset').onclick=()=>{pattern=[];$('score').innerHTML=''};$('finish').onclick=()=>{if(pattern.length>=need)complete('Hoan hô! Bé là nghệ sĩ tí hon!');else feedback('Bé hãy chơi đủ '+need+' nốt nhạc nhé!')}}function home(){$('game').classList.add('hidden');$('home').classList.remove('hidden');mode=-1;all=false;$('progress').textContent='🎵 6 khu vườn âm nhạc';try{speechSynthesis.cancel()}catch(e){}}$('back').onclick=home;$('intro').onclick=()=>say('Xin chào các bạn nhỏ! Chào mừng đến với Vườn âm nhạc kỳ diệu. Hãy chọn một trò chơi để cùng khám phá âm nhạc nhé!');$('all').onclick=()=>{start(0);all=true};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 Âm thanh: Tắt':'🔊 Âm thanh: Bật';if(!muted){tone(523,.2);say('Âm thanh đã bật')}else try{speechSynthesis.cancel()}catch(e){}};window.addEventListener('pagehide',()=>{try{speechSynthesis.cancel()}catch(e){}});})();
</script></body></html>
